trigger: none

pool: cicdpool

variables:
  SKIP_GITLEAKS: 'true'
  SKIP_TFLINT: 'ture'

stages:

# ============================================================
# GITLEAKS SCANNING
# ============================================================

- stage: scanningtools
  displayName: "Security Scanning"

  jobs:
  - job: gitleaks
    displayName: "Gitleaks Secret Scan"

    steps:
    - task: PowerShell@2
      displayName: "Gitleaks Secret Scan"
      inputs:
        targetType: 'inline'
        script: |

          if ("$(SKIP_GITLEAKS)" -eq "true") {
              Write-Host "WARNING: Gitleaks scan has been intentionally skipped."
              exit 0
          }

          Write-Host "Running Gitleaks secret scan..."

          gitleaks detect `
            --source . `
            --config env/dev/.gitleaks.toml `
            --verbose `
            --redact `
            --exit-code 1

          if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Gitleaks detected a secret!"
              Write-Host "##vso[task.complete result=Failed;]Gitleaks Secret Scan Failed"
              exit 1
          }

          Write-Host "Gitleaks scan passed successfully."

  - job: tflint
    displayName: "TFlint scanning tool"
    steps:    
      - task: PowerShell@2
        displayName: "TFLint Terraform Scan"
        env:
          SKIP_TFLINT: $(SKIP_TFLINT)
        inputs:
          targetType: 'inline'
          script: |

            Write-Host "SKIP_TFLINT = $env:SKIP_TFLINT"

            if ($env:SKIP_TFLINT -eq "true") {
                Write-Host "WARNING: TFLint scan has been intentionally skipped."
                exit 0
            }

            Write-Host "Running TFLint Terraform scan..."

            tflint --chdir=env/dev --format compact

            if ($LASTEXITCODE -ne 0) {
                Write-Host "##vso[task.logissue type=error]TFLint found Terraform issues!"
                Write-Host "##vso[task.complete result=Failed;]TFLint Scan Failed"
                exit 1
            }

            Write-Host "TFLint scan passed successfully."


# ============================================================
# TERRAFORM INIT + PLAN
# ============================================================

- stage: initandplan
  displayName: "Terraform Init and Plan"

  jobs:
  - job: init
    displayName: "Terraform Init and Plan"

    steps:

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'cicdinfra_sc'
        backendAzureRmStorageAccountName: 'terraformstatefile55'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.state'

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        environmentServiceNameAzureRM: 'cicdinfra_sc'


